<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clinical Biomechanics Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-slate-100/70 text-slate-800 font-sans pb-16">

    <header
        class="bg-white border-b border-slate-200 sticky top-0 z-20 px-6 py-3.5 flex items-center justify-between shadow-xs">
        <div class="flex items-center gap-3">
            <div
                class="w-8 h-8 rounded-lg bg-teal-600 text-white flex items-center justify-center font-black text-base shadow-sm">
                +</div>
            <div>
                <h1 class="text-sm font-bold text-slate-900 leading-tight">Clinical Biomechanics Engine</h1>
                <p class="text-xs text-slate-500">FastAPI Modular Workspace</p>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-6 mt-8">
        <section class="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm mb-8">
            <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Instruksi Evaluasi
                Biomekanik</label>
            <div class="flex flex-col sm:flex-row gap-3">
                <input id="prompt-input" type="text"
                    placeholder="Contoh: 'Evaluasi nyeri leher dan pergelangan tangan akibat postur kerja'..."
                    class="flex-1 px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-teal-600 focus:bg-white transition-all" />
                <button id="btn-generate" onclick="handleGenerate()"
                    class="px-6 py-3 bg-teal-700 hover:bg-teal-800 text-white text-sm font-semibold rounded-xl transition-all flex items-center justify-center gap-2 shrink-0 shadow-sm">
                    <span id="btn-text">Rancang Evaluasi</span>
                </button>
            </div>
            <div class="mt-4 flex items-center gap-2 flex-wrap text-xs">
                <span class="text-slate-400 font-medium">Skenario:</span>
                <button onclick="setPromptAndRun('Evaluasi ergonomi kantor: ketegangan leher dan pergelangan tangan')"
                    class="bg-teal-50 hover:bg-teal-100 text-teal-800 px-3 py-1.5 rounded-full border border-teal-200 transition-colors">Ergonomi
                    Kantor</button>
                <button onclick="setPromptAndRun('Rehabilitasi cedera ligamen lutut (ACL)')"
                    class="bg-teal-50 hover:bg-teal-100 text-teal-800 px-3 py-1.5 rounded-full border border-teal-200 transition-colors">Rehabilitasi
                    ACL</button>
            </div>
        </section>

        <section id="refinement-container"
            class="hidden mb-6 p-4 bg-gradient-to-r from-teal-50 via-cyan-50 to-white border border-teal-200 rounded-2xl shadow-xs">
            <div class="flex items-start gap-3">
                <div
                    class="w-7 h-7 rounded-lg bg-teal-600 text-white flex items-center justify-center font-bold text-xs shrink-0 mt-0.5">
                    ✦</div>
                <div class="flex-1">
                    <p id="refinement-question" class="text-sm font-semibold text-slate-900 mb-1"></p>
                    <div id="refinement-options" class="flex flex-wrap gap-2 mt-3"></div>
                </div>
            </div>
        </section>

        <div id="canvas-header" class="hidden mb-4">
            <h2 id="workspace-title" class="text-xl font-bold text-slate-900 tracking-tight"></h2>
            <p id="workspace-desc" class="text-xs text-slate-600 mt-1 max-w-2xl"></p>
        </div>

        <div id="canvas-grid" class="grid grid-cols-12 gap-5">
            <div id="empty-state"
                class="col-span-12 border-2 border-dashed border-slate-200 rounded-2xl p-16 text-center bg-white/50">
                <h3 class="font-semibold text-slate-700 text-base mb-1">Kanvas Pemantauan Siap</h3>
                <p class="text-sm text-slate-500 max-w-md mx-auto">Tuliskan kasus atau perintah di atas untuk merender
                    dashboard dinamis.</p>
            </div>
        </div>
    </main>

    <script>
        let currentWorkspace = null;
        const coordinates = {
            brain: { top: "12%", left: "50%" }, neck: { top: "19%", left: "50%" },
            shoulders: { top: "25%", left: "34%" }, chest: { top: "27%", left: "50%" },
            heart: { top: "28%", left: "54%" }, back: { top: "33%", left: "50%" },
            abdomen: { top: "42%", left: "50%" }, arms: { top: "35%", left: "28%" },
            wrists: { top: "52%", left: "22%" }, hips: { top: "52%", left: "50%" },
            legs: { top: "65%", left: "42%" }, knees: { top: "75%", left: "42%" }, ankles: { top: "90%", left: "42%" }
        };

        function setPromptAndRun(text) { document.getElementById("prompt-input").value = text; handleGenerate(text); }

        async function handleGenerate(overrideQuery) {
            const input = document.getElementById("prompt-input");
            const textToSend = overrideQuery || input.value;
            if (!textToSend.trim()) return;

            const btn = document.getElementById("btn-generate");
            const btnText = document.getElementById("btn-text");
            btn.disabled = true; btnText.textContent = "Memproses...";

            try {
                const res = await fetch("/api/v1/workspace/generate", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        prompt: textToSend,
                        previousContext: currentWorkspace ? JSON.stringify(currentWorkspace) : null
                    })
                });
                const data = await res.json();
                currentWorkspace = data;
                renderWorkspace(data);
                input.value = "";
            } catch (err) {
                alert("Gagal memproses permintaan.");
            } finally {
                btn.disabled = false; btnText.textContent = "Rancang Evaluasi";
            }
        }

        function renderWorkspace(ws) {
            document.getElementById("empty-state")?.remove();
            document.getElementById("canvas-header").classList.remove("hidden");
            document.getElementById("workspace-title").textContent = ws.workspaceTitle;
            document.getElementById("workspace-desc").textContent = ws.description || "";

            const refBox = document.getElementById("refinement-container");
            if (ws.refinement) {
                refBox.classList.remove("hidden");
                document.getElementById("refinement-question").textContent = ws.refinement.question;
                const optContainer = document.getElementById("refinement-options");
                optContainer.innerHTML = "";
                ws.refinement.options.forEach(opt => {
                    const b = document.createElement("button");
                    b.className = "text-xs font-medium bg-white hover:bg-teal-700 hover:text-white text-slate-700 border border-slate-200 px-3 py-1.5 rounded-lg transition-all shadow-xs";
                    b.textContent = "+ " + opt;
                    b.onclick = () => handleGenerate(opt);
                    optContainer.appendChild(b);
                });
            } else { refBox.classList.add("hidden"); }

            const grid = document.getElementById("canvas-grid");
            grid.innerHTML = "";
            ws.widgets.forEach(widget => {
                const col = Math.min(Math.max(widget.colSpan || 6, 3), 12);
                const wrapper = document.createElement("div");
                wrapper.style.gridColumn = `span ${col} / span ${col}`;
                wrapper.className = "min-h-[220px]";

                let innerContent = `<h3 class="font-semibold text-sm text-slate-900 mb-3">${widget.title}</h3>`;

                // 1. Cek jika memiliki data array (Bar/Line/Donut Chart)
                if (widget.props?.data && Array.isArray(widget.props.data) && widget.props.data.length > 0) {
                    const dataPoints = widget.props.data;
                    const maxVal = Math.max(...dataPoints.map(d => d.value), 1);
                    let barsHtml = '<div class="space-y-2.5 mt-2">';
                    dataPoints.forEach(d => {
                        const pct = Math.min(Math.max((d.value / maxVal) * 100, 5), 100);
                        barsHtml += `
              <div>
                <div class="flex justify-between text-xs text-slate-600 mb-1 font-medium">
                  <span>${d.label}</span>
                  <span class="font-bold text-slate-900">${d.value}</span>
                </div>
                <div class="w-full bg-slate-100 h-2.5 rounded-full overflow-hidden">
                  <div class="bg-teal-600 h-2.5 rounded-full transition-all duration-500" style="width: ${pct}%"></div>
                </div>
              </div>`;
                    });
                    barsHtml += '</div>';
                    innerContent += barsHtml;
                }
                // 2. Cek jika tipe MetricCard
                else if (widget.type === "MetricCard" || widget.props?.metricValue) {
                    innerContent += `
            <div class="flex items-baseline gap-2 mt-4">
              <span class="text-4xl font-black text-teal-700">${widget.props?.metricValue || '0'}</span>
              <span class="text-xs font-bold text-slate-400 uppercase">${widget.props?.unit || ''}</span>
            </div>`;
                }
                // 3. Cek jika BodyAnatomyMap
                else if (widget.type === "BodyAnatomyMap" || widget.props?.bodyPoints) {
                    innerContent += `<div class="bg-slate-950 text-white rounded-xl p-4 flex flex-col justify-center min-h-[140px] mt-2">
            <p class="text-xs text-teal-400 font-semibold mb-2">⚡ Pemindaian Titik Tubuh Aktif</p>`;
                    (widget.props?.bodyPoints || []).forEach(p => {
                        innerContent += `<div class="text-xs text-slate-300 bg-slate-900 px-3 py-2 rounded-lg w-full mb-1.5 flex justify-between items-center border border-slate-800">
              <span class="font-bold capitalize text-white">${p.part}</span>
              <span class="text-slate-400 text-right">${p.description}</span>
            </div>`;
                    });
                    innerContent += `</div>`;
                }
                // 4. Fallback Cerdas: Jika tidak ada data chart, tapi ada deskripsi teks/catatan, tampilkan dengan rapi alih-alih kosong
                else {
                    const textContent = widget.props?.notesContent || widget.description || "Analisis biomekanik dan parameter klinis tercatat aktif.";
                    innerContent += `<div class="bg-slate-50 border border-slate-100 p-3.5 rounded-xl mt-2">
            <p class="text-xs text-slate-700 leading-relaxed">${textContent}</p>
          </div>`;
                }

                wrapper.innerHTML = `<div class="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm h-full flex flex-col justify-between">${innerContent}</div>`;
                grid.appendChild(wrapper);
            });
        }
    </script>
</body>

</html>
